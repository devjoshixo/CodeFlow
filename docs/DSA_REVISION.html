<script>(function () {
  "use strict";
  var STORE_KEY = "dsa-revision-progress-v1";
  var THEME_KEY = "dsa-revision-theme";

  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || "light";
  }
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    var b = document.getElementById("themeBtn");
    if (b) b.textContent = t === "dark" ? "Light" : "Dark";
  }

  var md = document.getElementById("source").textContent;
  if (window.marked && marked.setOptions) {
    marked.setOptions({ gfm: true, breaks: false });
  }
  var content = document.getElementById("content");
  content.innerHTML = marked.parse(md);

  var seen = {};
  function slug(text) {
    var s = text.toLowerCase().trim().replace(/[^\w\s-]/g, "").replace(/\s/g, "-");
    if (seen[s] != null) { seen[s]++; s = s + "-" + seen[s]; } else { seen[s] = 0; }
    return s;
  }
  content.querySelectorAll("h1,h2,h3,h4").forEach(function (h) {
    if (!h.id) h.id = slug(h.textContent);
  });

  if (window.hljs) {
    content.querySelectorAll("pre code").forEach(function (b) {
      try { hljs.highlightElement(b); } catch (e) {}
    });

    var btn = document.createElement("button");

      var text = code ? code.innerText : pre.innerText;

        btn.textContent = "Copied!";
        setTimeout(function () { btn.textContent = "Copy"; }, 1200);
      }).catch(function () { btn.textContent = "Err"; });
    });
    pre.appendChild(btn);
  });

  content.querySelectorAll("table").forEach(function (t) {
    if (t.parentElement && t.parentElement.classList.contains("table-wrap")) return;
    var w = document.createElement("div");
    w.className = "table-wrap";
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });

  var allH2 = Array.prototype.slice.call(content.querySelectorAll("h2"));
  var sections = allH2.filter(function (h) { return /^\s*\d+\./.test(h.textContent); });

  var progress = {};
  try { progress = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { progress = {}; }
  function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {} }

  var navRoot = document.getElementById("navList");
  var navLinkById = {};
  var dotById = {};

  function childHeadingsAfter(h2) {
    var out = [], n = h2.nextElementSibling;
    while (n && n.tagName !== "H2") { if (n.tagName === "H3") out.push(n); n = n.nextElementSibling; }
    return out;
  }

  sections.forEach(function (h2) {
    var id = h2.id;

    var label = document.createElement("label");
    label.className = "reviewed-toggle";
    var cb = document.createElement("input");
    cb.type = "checkbox";
    var span = document.createElement("span");
    span.textContent = "Reviewed";
    label.appendChild(cb); label.appendChild(span);
    h2.appendChild(label);

    function applyState(done) {
      cb.checked = done;
      label.classList.toggle("is-done", done);
      h2.classList.toggle("done-head", done);
      if (dotById[id]) dotById[id].classList.toggle("done", done);
    }
    cb.addEventListener("change", function () {
      if (cb.checked) progress[id] = true; else delete progress[id];
      saveProgress(); applyState(cb.checked); updateProgressBar();
    });

    var li = document.createElement("li");
    li.className = "sec";
    var a = document.createElement("a");
    a.href = "#" + id;
    var dot = document.createElement("span"); dot.className = "dot";
    var txt = document.createElement("span"); txt.textContent = h2.textContent.replace("Reviewed", "").trim();
    a.appendChild(dot); a.appendChild(txt);
    li.appendChild(a);
    navLinkById[id] = a; dotById[id] = dot;

    var subs = childHeadingsAfter(h2);
    if (subs.length) {
      var ul = document.createElement("ul"); ul.className = "sub";
      subs.forEach(function (h3) {
        var sli = document.createElement("li");
        var sa = document.createElement("a");
        sa.href = "#" + h3.id; sa.textContent = h3.textContent.trim();
        sli.appendChild(sa); ul.appendChild(sli);
        navLinkById[h3.id] = sa;
      });
      li.appendChild(ul);
    }
    navRoot.appendChild(li);
    applyState(!!progress[id]);
  });

  function updateProgressBar() {
    var total = sections.length;
    var done = sections.filter(function (h) { return !!progress[h.id]; }).length;
    var pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressLabel").textContent = done + " / " + total + " (" + pct + "%)";
  }
  updateProgressBar();

  var spyTargets = sections.concat(
    Array.prototype.slice.call(content.querySelectorAll("h3")).filter(function (h) { return h.id; })
  ).sort(function (a, b) { return a.offsetTop - b.offsetTop; });

  function onScroll() {
    var y = window.scrollY + 80;
    var activeId = null;
    for (var i = 0; i < spyTargets.length; i++) {
      if (spyTargets[i].offsetTop <= y) activeId = spyTargets[i].id; else break;
    }
    var ownerSecId = null;
    for (var j = 0; j < sections.length; j++) {
      if (sections[j].offsetTop <= y) ownerSecId = sections[j].id; else break;
    }
    Object.keys(navLinkById).forEach(function (id) {
      navLinkById[id].classList.toggle("active", id === activeId);
    });
    document.querySelectorAll("nav.sidebar .sec").forEach(function (sec) {
      var link = sec.querySelector("a");
      sec.classList.toggle("open", !!(link && link.getAttribute("href") === "#" + ownerSecId));
    });
    document.getElementById("toTop").classList.toggle("show", window.scrollY > 600);
  }
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (!ticking) { window.requestAnimationFrame(function () { onScroll(); ticking = false; }); ticking = true; }
  }, { passive: true });
  onScroll();

  navRoot.addEventListener("click", function (e) {
    if (e.target.closest("a")) document.body.classList.remove("nav-open");
  });

  var searchInput = document.getElementById("search");
  searchInput.addEventListener("input", function () {
    var q = searchInput.value.toLowerCase().trim();
    document.querySelectorAll("nav.sidebar .sec").forEach(function (sec) {
      var secText = sec.querySelector("a").textContent.toLowerCase();
      var subLinks = sec.querySelectorAll(".sub a");
      var subMatch = false;
      subLinks.forEach(function (sl) {
        var m = sl.textContent.toLowerCase().indexOf(q) !== -1;
        sl.parentElement.style.display = (q === "" || m) ? "" : "none";
        if (m) subMatch = true;
      });
      var show = q === "" || secText.indexOf(q) !== -1 || subMatch;
      sec.style.display = show ? "" : "none";
      if (q !== "" && subMatch) sec.classList.add("open");
    });
  });

  document.getElementById("themeBtn").addEventListener("click", function () {
    setTheme(currentTheme() === "dark" ? "light" : "dark");
  });
  setTheme(currentTheme());

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!confirm("Reset all reviewed progress?")) return;
    progress = {}; saveProgress();
    sections.forEach(function (h2) {
      var cb = h2.querySelector(".reviewed-toggle input");
      if (cb) cb.checked = false;
      h2.classList.remove("done-head");
      var lbl = h2.querySelector(".reviewed-toggle");
      if (lbl) lbl.classList.remove("is-done");
      if (dotById[h2.id]) dotById[h2.id].classList.remove("done");
    });
    updateProgressBar();
  });

  document.getElementById("hamburger").addEventListener("click", function () {
    document.body.classList.toggle("nav-open");
  });
  document.getElementById("toTop").addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();</script>
</body>
</html>
